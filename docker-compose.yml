services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - CI=true
      - NODE_ENV=production
      - PORT=3000
      - DB_CONNECTION_URL=postgres://tanta:${PASSWORD:-n0nS3cure}@db:5432/TantaFinancial
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/documents
    command: ["sh", "-c", "pnpm migration:run && pnpm seed:run && pnpm start"]

  db:
    image: postgres:18.0-alpine3.21
    environment:
      - POSTGRES_USER=tanta
      - POSTGRES_PASSWORD=${PASSWORD:-n0nS3cure}
      - POSTGRES_DB=TantaFinancial
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanta -d TantaFinancial"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

volumes:
  pgdata: